<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchtower</title>
<!-- Inline so the page never requests a favicon it doesn't have: the 404 was
     the only console error on a clean load, and it fires on every request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23A82C22'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="rail">
  <div class="rail-mark">
    <span class="pip" aria-hidden="true"></span>
    <span class="rail-name">WATCHTOWER</span>
  </div>
  <nav class="rail-nav">
    <button class="tab is-on" data-view="sweep">Sweep</button>
    <button class="tab" data-view="archive">Archive</button>
  </nav>
  <div class="rail-status" id="ai-status" title="Relevance scoring status"></div>
</header>

<main>

<!-- ============================ SWEEP ============================ -->
<section id="view-sweep">

  <form class="console" id="sweep-form" autocomplete="off">
    <label class="field-label" for="q">What are you looking for</label>
    <div class="field">
      <input id="q" name="q" type="text" spellcheck="false"
             placeholder="beneficial ownership Kenya"
             aria-describedby="q-hint">
      <button type="submit" id="go">Sweep</button>
    </div>
    <p class="hint" id="q-hint">
      Plain keywords work. GDELT also takes operators:
      <code>sourcecountry:KE</code>, <code>"exact phrase"</code>, <code>(a OR b)</code>.
    </p>

    <div class="controls">
      <fieldset class="control">
        <legend>Look back</legend>
        <div class="segmented" id="window" role="radiogroup" aria-label="Lookback window">
          <button type="button" role="radio" data-h="24">24h</button>
          <button type="button" role="radio" data-h="72" class="is-on" aria-checked="true">72h</button>
          <button type="button" role="radio" data-h="168">7d</button>
          <button type="button" role="radio" data-h="720">30d</button>
        </div>
      </fieldset>

      <fieldset class="control control-wide">
        <legend>Sources</legend>
        <div class="chips" id="sources"></div>
      </fieldset>

      <fieldset class="control">
        <legend>Depth</legend>
        <label class="toggle">
          <input type="checkbox" id="fetch-bodies" checked>
          <span>Read full articles</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="use-ai" checked>
          <span>Score with Claude</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="keep">
          <span>Keep results</span>
        </label>
      </fieldset>
    </div>
  </form>

  <!-- signature element: sources report in live as the sweep runs -->
  <section class="trace" id="trace" hidden aria-live="polite">
    <div class="trace-head">
      <span class="trace-title" id="trace-title">Sweeping</span>
      <span class="trace-stage" id="trace-stage"></span>
    </div>
    <div class="trace-lanes" id="lanes"></div>
  </section>

  <section id="results" hidden>
    <div class="summary" id="summary"></div>
    <div class="layout">
      <div class="findings" id="findings"></div>
      <aside class="side" id="side"></aside>
    </div>
  </section>

  <section class="empty" id="empty" hidden></section>
</section>

<!-- =========================== ARCHIVE =========================== -->
<section id="view-archive" hidden>
  <form class="console" id="archive-form" autocomplete="off">
    <label class="field-label" for="aq">Search everything you've kept</label>
    <div class="field">
      <input id="aq" type="text" spellcheck="false"
             placeholder="kenya AND (fraud OR laundering)">
      <button type="submit">Search</button>
    </div>
    <p class="hint">
      Full-text search over saved sweeps. Takes <code>AND</code>,
      <code>OR</code>, <code>NOT</code>, <code>"phrases"</code> and
      <code>prefix*</code>.
    </p>
  </form>
  <div class="findings" id="archive-results"></div>
</section>

</main>

<script src="/app.js"></script>
</body>
</html>
